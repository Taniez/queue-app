<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>ระบบคิว</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #2c3e50;
      font-size: 3.5rem;
      margin-bottom: 30px;
    }
    input[type="text"],
    input[type="password"],
    button {
      width: 90vw;
      max-width: 500px;
      font-size: 28px;
      padding: 20px 25px;
      margin: 18px auto;
      display: block;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.5);
    }
    button:hover {
      background-color: #2980b9;
      box-shadow: 0 6px 16px rgba(41, 128, 185, 0.6);
    }
    #queueList {
      list-style: none;
      padding: 0;
      margin-top: 30px;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }
    #queueList li {
      background-color: #ecf0f1;
      padding: 25px 30px;
      margin: 12px auto;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
      font-size: 28px;
      box-sizing: border-box;
      max-width: 480px;
      font-weight: 600;
    }
    .admin-controls {
      margin-top: 30px;
    }
    .admin-auth {
      margin-top: 30px;
    }
    .admin-status {
      font-weight: 700;
      margin-top: 10px;
      font-size: 22px;
      min-height: 28px;
    }
    .admin-success { color: green; }
    .admin-error { color: red; }
    .queue-item {
      opacity: 0;
      transform: translateX(60px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .queue-item.show {
      opacity: 1;
      transform: translateX(0);
    }
    .cutoff-mode { background-color: #fff5f5 !important; }
    .queue-item.cutoff {
      background-color: #ff6b6b !important;
      color: white;
    }
    .floating-sticker {
      position: fixed;
      width: 120px;
      z-index: 9999;
      pointer-events: none;
      animation: floatUp 3s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(50px) scale(0.8); }
      20% { opacity: 1; transform: translateY(0px) scale(1); }
      100% { opacity: 0; transform: translateY(-150px) scale(1.2) rotate(10deg); }
    }
    #adminBtn{
    position:fixed;
    top:12px;
    right:12px;

    width:52px;
    height:52px;

    border-radius:50%;
    padding:0;

    font-size:22px;

    z-index:9999;
}
#queueList{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:0;
}

#queueList li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    padding:15px;
    margin:12px 0;

    border-radius:14px;
    box-sizing:border-box;

    word-break:break-word;
}

/* ชื่อ */

.queue-name{
    flex:1;
    text-align:left;
    font-size:22px;
    font-weight:bold;
}

/* กลุ่มปุ่ม */

.admin-actions{
    display:flex;
    gap:8px;
}

/* ปุ่มเล็ก */

.small-btn{

    width:auto !important;
    max-width:none !important;

    margin:0 !important;

    padding:8px 15px !important;

    font-size:16px !important;

    border-radius:8px;
}

.done-btn{
    background:#27ae60;
}

.cancel-btn{
    background:#e74c3c;
}

.done-btn:hover{
    background:#229954;
}

.cancel-btn:hover{
    background:#c0392b;
}
@media(max-width:600px){

body{
    padding:12px;
}

h1{
    font-size:2rem;
    margin-top:45px;
}

h2{
    font-size:1.5rem !important;
}

input[type=text],
input[type=password]{

    width:100%;
    font-size:20px;
    padding:14px;
}

#userPanel button,
#adminButtons > button{

    width:100%;
    font-size:18px;
    padding:15px;
}

#queueList li{

    flex-direction:column;
    align-items:flex-start;
}

.queue-name{

    width:100%;
    font-size:20px;
    margin-bottom:8px;
}

.admin-actions{

    width:100%;
    justify-content:flex-end;
    flex-wrap:wrap;
}

.small-btn{

    font-size:15px !important;
    padding:10px 14px !important;
}

}
/* ===========================
   Mobile
=========================== */
@media (max-width:768px){

body{
    padding:16px;
}

h1{
    font-size:2rem;
    margin-top:55px;
    margin-bottom:20px;
}

h2{
    font-size:1.5rem !important;
}

input,
button{
    width:100%;
    max-width:none;
    font-size:20px;
    padding:16px;
}

#queueList{
    max-width:100%;
    padding:0;
}

#queueList li{
    max-width:none;
    width:100%;
    padding:18px;
    font-size:22px;
    box-sizing:border-box;
}

.queue-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.queue-buttons button{
    flex:1;
    margin:0;
    padding:12px;
    font-size:18px;
}

.admin-controls button{
    font-size:20px;
    padding:18px;
}

.floating-sticker{
    width:80px;
}

#adminBtn{
    width:48px;
    height:48px;
    font-size:20px;
    top:10px;
    right:10px;
}

}
  </style>
</head>
<body>
  <button id="adminBtn" onclick="showAdminLogin()">
    ⚙️
</button>
  <h1>ระบบคิวออนไลน์1.4.0</h1>
  <!-- <div class="admin-auth">
    <input type="password" id="adminPass" placeholder="รหัสผ่าน Admin" />
    <button onclick="checkAdmin()">ยืนยันตัวตน</button>
    <div id="adminStatus" class="admin-status"></div>
  </div> -->
  <div id="userPanel">
    <div>
      <input type="text" id="nameInput" placeholder="ชื่อของคุณ" />
      <button onclick="joinQueue()">เข้าคิว</button>
    </div>
  
    <h2 id="myQueue"></h2>
  </div>
  <div id="adminPanel" style="display:none;">
    <h3>Admin Mode</h3>
  </div>
  <div class="admin-controls" id="adminButtons" style="display: none;">

    <button onclick="toggleCutoff()">Cutoff (Admin เท่านั้น)</button>
    <button onclick="logoutAdmin()">ออกจากระบบ</button>
  </div>
  <h2 style="font-size: 2.8rem; margin-top: 40px;">คิวปัจจุบัน</h2>
  <ul id="queueList"></ul>
  
  <script>
    let isCutoff = false;
    let stickerInterval = null;
   
    
    const socket = io();
    let adminVerified = false;
    function finishCheck(){

socket.emit("finish-check");

}


    function isAdmin() { return adminVerified; }

    // function checkAdmin() {
    //   const password = document.getElementById('adminPass').value;
    //   socket.emit('check-admin', password);
    //   document.getElementById('adminPass').value = '';
    // }
    async function showAdminLogin(){

const { value: password } = await Swal.fire({
    title: 'Admin Login',
    input: 'password',
    inputPlaceholder: 'กรอกรหัสผ่าน',
    inputAttributes:{
        autocapitalize:'off',
        autocorrect:'off'
    },
    showCancelButton:true,
    confirmButtonText:'เข้าสู่ระบบ',
    cancelButtonText:'ยกเลิก'
});

if(password){
    socket.emit("check-admin", password);
}

}


socket.on("admin-status",(isValid)=>{

adminVerified=isValid;

if(isValid){

    Swal.fire({
        icon:'success',
        title:'เข้าสู่ระบบสำเร็จ',
        timer:1200,
        showConfirmButton:false
    });

    document.getElementById("adminButtons").style.display="block";
    document.getElementById("userPanel").style.display="none";

}else{

    Swal.fire({
        icon:'error',
        title:'รหัสผ่านไม่ถูกต้อง'
    });

}

});

socket.on('queue-update', (queue) => {
  const ul = document.getElementById('queueList');
  ul.innerHTML = '';

  const myName = localStorage.getItem("myName") || "";
  const index = queue.findIndex(q => q.name === myName);

  document.getElementById("myQueue").innerHTML =
    index === -1 ? "" : `🎉 ตอนนี้คุณอยู่คิวที่ <b>${index + 1}</b>`;

  queue.forEach((item, i) => {
    const li = document.createElement("li");

li.style.display = "flex";
li.style.justifyContent = "space-between";
li.style.alignItems = "center";
li.style.gap = "12px";

const text = document.createElement("span");
const title = document.createElement("div");

title.className = "queue-name";

title.textContent = `${i + 1}. ${item.name}`;

li.appendChild(title);
text.style.flex = "1";

li.appendChild(text);

    // 🟡 highlight
    if (item.status === "checking") {

li.style.background = "#ffe066";

// เป็นของเราไหม
const isMine = item.checker === socket.id;

if (adminVerified && isMine) {

    const wrap = document.createElement("div");
    wrap.style.display = "flex";
    wrap.style.gap = "10px";
    wrap.style.justifyContent = "center";
    wrap.style.marginTop = "15px";

    const doneBtn = document.createElement("button");
    doneBtn.textContent = "✅ ตรวจเสร็จ";
    doneBtn.style.margin = "0";
    doneBtn.style.width = "160px";

    doneBtn.onclick = (e)=>{
        e.stopPropagation();
        socket.emit("finish-one", item.id);
    };

    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "↩ ยกเลิก";
    cancelBtn.style.margin = "0";
    cancelBtn.style.width = "160px";
    cancelBtn.style.background = "#999";

    cancelBtn.onclick = (e)=>{
        e.stopPropagation();
        socket.emit("cancel-check", item.id);
    };

    wrap.appendChild(doneBtn);
    wrap.appendChild(cancelBtn);

    li.appendChild(wrap);

}

} 
    let lastClick = 0;

    li.onclick = () => {
  if (!adminVerified) return;

  socket.emit("select-check", item.id);
};
    ul.appendChild(li);
});
});

socket.on("queue-already-checking", () => {

Swal.fire({
    icon: "warning",
    title: "คิวนี้มีคนกำลังตรวจอยู่"
});

});

    socket.on('cutoff-status', (state) => {
      isCutoff = state;
      document.body.classList.toggle('cutoff-mode', isCutoff);
      if (isCutoff) startStickerLoop();
      else stopStickerLoop();
    });

    function joinQueue() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return Swal.fire({ icon:'error', title:'ใส่ชื่อก่อน' });

  localStorage.setItem("myName", name);

  socket.emit('join-queue', {
    name,
    isCutoff
  });

  Swal.fire({
    icon: 'success',
    title: 'เข้าคิวสำเร็จ',
    timer: 1200,
    showConfirmButton: false
  });

  document.getElementById("myQueue").innerHTML = "⏳ กำลังเข้าคิว...";
  document.getElementById('nameInput').value = '';
}

    function nextQueue() {
      if (!isAdmin()) return Swal.fire({ icon: 'error', title: 'ไม่อนุญาต', text: 'คุณไม่ใช่ผู้ดูแลระบบ' });
      socket.emit('next-queue', true);
    }

    function toggleCutoff() {
      if (!isAdmin()) return Swal.fire({ icon: 'error', title: 'ไม่อนุญาต', text: 'คุณไม่ใช่ผู้ดูแลระบบ' });
      socket.emit('set-cutoff', !isCutoff);
    }

    function startStickerLoop() {
      if (stickerInterval) return;
      stickerInterval = setInterval(showRandomSticker, Math.random() * 2000 + 2500);
    }

    function stopStickerLoop() {
      clearInterval(stickerInterval);
      stickerInterval = null;
    }

    function logoutAdmin(){

adminVerified=false;

document.getElementById("adminButtons").style.display="none";
document.getElementById("userPanel").style.display="block";

Swal.fire({
    icon:'success',
    title:'ออกจากระบบแล้ว',
    timer:1000,
    showConfirmButton:false
});

}

document.body.appendChild(img);

// เล่นเสียง
const audio = new Audio(sticker.sound);
audio.volume = 0.5;

  </script>
</body>
</html>
